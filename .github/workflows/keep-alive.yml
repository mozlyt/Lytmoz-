name: Keep HQ database awake

# Supabase pauses free projects after 7 days without activity.
# This makes a tiny read every 3 days so the Lytmoz HQ stays on.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://rfcyjjtujrgzneokjfmd.supabase.co/rest/v1/rpc/keep_alive" \
            -X POST -H "apikey: sb_publishable_oUnHKZ1NqD1Q7_aKe40Riw_xaMh6e3e" \
            -H "Content-Type: application/json" -d '{}')
          echo "Supabase answered $code"
          test "$code" = "200"
